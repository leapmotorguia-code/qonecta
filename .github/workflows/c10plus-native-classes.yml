name: C10 Plus - módulo para APK original UNIT

on:
  push:
    branches: [feature/c10plus-tu-apk-unit-nativa, feature/unit-basada-en-08-estable, feature/unit-c10-4-5-1-installer-resume, feature/unit-45-cockpit-merge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android compiler only
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile native entry and tabs without Qonecta rebuild
        run: |
          mkdir -p c10plus-native/out/classes c10plus-native/out/dex
          javac -source 8 -target 8 -Xlint:none -encoding UTF-8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d c10plus-native/out/classes \
            c10plus-native/src/es/leapmotorguia/c10plus/*.java
          find c10plus-native/out/classes -name '*.class' -print0 | \
            xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" \
              --min-api 28 \
              --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
              --output c10plus-native/out/dex
          test -s c10plus-native/out/dex/classes.dex
      - name: Test energy balance calculations
        run: |
          mkdir -p c10plus-native/out/tests
          javac -source 8 -target 8 -encoding UTF-8 -d c10plus-native/out/tests             c10plus-native/src/es/leapmotorguia/c10plus/EnergyBalance.java             c10plus-native/tests/es/leapmotorguia/c10plus/EnergyBalanceTest.java
          java -cp c10plus-native/out/tests es.leapmotorguia.c10plus.EnergyBalanceTest
      - name: Test model profile classification
        run: |
          mkdir -p c10plus-native/out/tests
          javac -source 8 -target 8 -encoding UTF-8 -d c10plus-native/out/tests \
            c10plus-native/src/es/leapmotorguia/c10plus/VehicleProfileHints.java \
            c10plus-native/tests/es/leapmotorguia/c10plus/VehicleProfileHintsTest.java
          java -cp c10plus-native/out/tests es.leapmotorguia.c10plus.VehicleProfileHintsTest
      - name: Bundle SDK signing utilities (no private keys)
        run: |
          mkdir -p c10plus-native/out/tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" c10plus-native/out/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" c10plus-native/out/tools/
          chmod +x c10plus-native/out/tools/zipalign
      - name: Upload DEX and Android tools
        uses: actions/upload-artifact@v4
        with:
          name: C10Plus-Native-Addon-DEX
          path: |
            c10plus-native/out/dex/classes.dex
            c10plus-native/out/tools/apksigner.jar
            c10plus-native/out/tools/zipalign
          if-no-files-found: error
          retention-days: 14
