name: C10 - APK de prueba
on:
  push:
    branches: [c10-pruebas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Instalar herramientas Android
        run: |
          NDK=$(sed -n 's/^ *ndkVersion *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          sdkmanager "ndk;$NDK" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar cronómetros y costes
        run: ./gradlew :app:testGithubDebugUnitTest --tests 'com.headqlink.link.LaunchTimerTest' --tests 'com.headqlink.link.C10TimersTest' --stacktrace
      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleGithubDebug --stacktrace
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: C10-APK-prueba
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7
