name: C10 Nativa Plus alfa
on:
  push:
    branches: [c10-nativa-qonecta-01]
    paths: ['app/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c10-native-plus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Instalar NDK y CMake fijados por el proyecto
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar anfitrión nativo y módulo propio
        run: ./gradlew :app:assembleGithubDebug -Pc10Native=true --stacktrace
      - name: Comprobar manifiesto y firma
        run: |
          APK=$(find app/build/outputs/apk/github/debug -name '*.apk' | head -1)
          test -n "$APK"
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOL_DIR/apksigner" verify --verbose "$APK"
          "$TOOL_DIR/aapt" dump badging "$APK" | tee /tmp/badging
          grep "name='com.leapmotorguia.c10nativeplus'" /tmp/badging
          grep "targetSdkVersion:'36'" /tmp/badging
          cp "$APK" /tmp/native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Nativa-Plus-0.7-alfa
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 tools/c10_native_smoke.py
