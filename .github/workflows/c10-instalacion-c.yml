name: C10 Prueba C instalación
on:
  push:
    branches: [c10-compatibilidad-instalacion-05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Comprobar cálculos y prestaciones
        run: |
          mkdir -p /tmp/c10-test
          javac -d /tmp/c10-test c10-native/app/src/main/java/com/leapmotorguia/c10nativa/{CostCalculator,PerformanceTimer}.java c10-native/tests/{CostCalculatorCheck,PerformanceTimerCheck}.java
          java -cp /tmp/c10-test CostCalculatorCheck
          java -cp /tmp/c10-test PerformanceTimerCheck
      - name: Compilar prueba C
        run: ./gradlew -p c10-native :app:assembleRelease
      - name: Verificar paquete y preparar comprobación de firma distinta
        run: |
          APK=c10-native/app/build/outputs/apk/release/app-release.apk
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOL_DIR/apksigner" verify --verbose "$APK"
          "$TOOL_DIR/aapt" dump badging "$APK" > /tmp/c10-badging
          grep "name='com.tencent.qqmusiccar'" /tmp/c10-badging
          grep "sdkVersion:'23'" /tmp/c10-badging
          grep "targetSdkVersion:'28'" /tmp/c10-badging
          keytool -genkeypair -keystore /tmp/c10-other.jks -storepass android -keypass android -alias other -keyalg RSA -keysize 2048 -validity 30 -dname "CN=C10 Temporary Signature Fixture"
          "$TOOL_DIR/apksigner" sign --ks /tmp/c10-other.jks --ks-pass pass:android --ks-key-alias other --out /tmp/c10-other-signer.apk "$APK"
          "$TOOL_DIR/apksigner" verify /tmp/c10-other-signer.apk
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 c10-native/tests/c_install_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Prueba-C-0.5
          path: c10-native/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
