name: Compilar UNIT C10 Plus 5.0 prueba
on:
  push:
    branches: ["fix/unit-c10-installer-action-view"]
    paths: [".github/workflows/compilar-unit-c10-50.yml", "c10plus-native/src/**"]
permissions:
  contents: read
jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Compilar cambios del módulo
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          mkdir -p out/classes out/dex out/tests out/tools
          javac -source 8 -target 8 -Xlint:none -encoding UTF-8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d out/classes c10plus-native/src/es/leapmotorguia/c10plus/*.java
          find out/classes -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output out/dex
          test -s out/dex/classes.dex
          javac -source 8 -target 8 -encoding UTF-8 -d out/tests c10plus-native/src/es/leapmotorguia/c10plus/EnergyBalance.java c10plus-native/tests/es/leapmotorguia/c10plus/EnergyBalanceTest.java c10plus-native/src/es/leapmotorguia/c10plus/VehicleProfileHints.java c10plus-native/tests/es/leapmotorguia/c10plus/VehicleProfileHintsTest.java
          java -cp out/tests es.leapmotorguia.c10plus.EnergyBalanceTest
          java -cp out/tests es.leapmotorguia.c10plus.VehicleProfileHintsTest
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" out/tools/
      - uses: actions/upload-artifact@v4
        with:
          name: UNIT-C10-50-compiled
          path: out
          retention-days: 14
