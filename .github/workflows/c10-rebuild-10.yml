name: C10 ControlPlus 1.1 nativa reconstruida
on:
  push:
    branches: [c10-nativa-rebuild-10]
    paths: ['app/**', 'c10installer/**', 'tools/c10_rebuild_smoke.py', 'docs/C10_REBUILD_11.md', 'settings.gradle.kts', '.github/workflows/c10-rebuild-10.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c10-rebuild-10
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compilar los APK completos y probar cálculos
        run: |
          mkdir -p deliverable "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=C10 Native Rebuild Test" -keyalg RSA -keysize 2048 -validity 3650 -storetype JKS
          fi
          set -o pipefail
          ./gradlew :app:assembleGithubRelease :c10installer:assembleRelease -Pc10Native=true -Pc10NativeAbis=arm64-v8a,armeabi-v7a,x86_64 --max-workers=2 --stacktrace > deliverable/compilacion.txt 2>&1 || { tail -100 deliverable/compilacion.txt; exit 1; }
          ./gradlew :app:testGithubReleaseUnitTest -Pc10Native=true -Pc10NativeAbis=arm64-v8a,armeabi-v7a,x86_64 --tests 'com.headqlink.link.C10RebuildTest' --max-workers=2 --stacktrace > deliverable/pruebas-unitarias.txt 2>&1 || { tail -100 deliverable/pruebas-unitarias.txt; exit 1; }
          cp app/build/outputs/apk/github/release/*.apk deliverable/C10-ControlPlus-1.1.apk
          cp c10installer/build/outputs/apk/release/*.apk deliverable/C10-Instalador-1.0.apk
          cp app/build/outputs/mapping/githubRelease/mapping.txt deliverable/mapping.txt
          cp app/build/test-results/testGithubReleaseUnitTest/TEST-com.headqlink.link.C10RebuildTest.xml deliverable/pruebas-unitarias.xml
      - name: Verificar manifiesto, firma y estructura de los archivos
        run: |
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for APK in deliverable/*.apk; do
            "$TOOL_DIR/apksigner" verify --verbose --print-certs "$APK" > "$APK.firma.txt"
            "$TOOL_DIR/zipalign" -c -P 16 4 "$APK"
            "$TOOL_DIR/aapt" dump badging "$APK" > "$APK.configuracion.txt"
            if grep -q 'application-debuggable\|testOnly' "$APK.configuracion.txt"; then exit 1; fi
            if grep -q '^[[:space:]]*uses-feature:' "$APK.configuracion.txt"; then echo 'Unexpected required feature'; exit 1; fi
          done
          grep "sdkVersion:'28'" deliverable/C10-ControlPlus-1.1.apk.configuracion.txt
          grep "targetSdkVersion:'36'" deliverable/C10-ControlPlus-1.1.apk.configuracion.txt
          grep "sdkVersion:'23'" deliverable/C10-Instalador-1.0.apk.configuracion.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('deliverable/C10-ControlPlus-1.1.apk') as z:
              assert z.testzip() is None
              assert all(z.getinfo(n).compress_type == zipfile.ZIP_STORED for n in z.namelist() if n.startswith('lib/') and n.endswith('.so'))
              assert {n.split('/')[1] for n in z.namelist() if n.startswith('lib/')} == {'arm64-v8a','armeabi-v7a','x86_64'}
          with zipfile.ZipFile('deliverable/C10-Instalador-1.0.apk') as z:
              assert z.testzip() is None
              assert not any(n.startswith('lib/') for n in z.namelist())
          PY
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 tools/c10_rebuild_smoke.py
      - name: Preparar paquete revisable
        run: |
          cp docs/C10_REBUILD_11.md deliverable/LEER-PRIMERO.md
          git archive --format=zip --output=deliverable/C10-ControlPlus-1.1-Codigo.zip HEAD
          git rev-parse HEAD > deliverable/COMMIT.txt
          sha256sum deliverable/*.apk deliverable/*Codigo.zip > deliverable/SHA256.txt
          (cd deliverable && zip -q C10-ControlPlus-1.1-Paquete.zip C10-ControlPlus-1.1.apk C10-Instalador-1.0.apk C10-ControlPlus-1.1-Codigo.zip LEER-PRIMERO.md SHA256.txt COMMIT.txt *.configuracion.txt *.firma.txt pruebas-unitarias.xml emulador-api30.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C10-ControlPlus-1.1-Resultado
          path: deliverable/*
          if-no-files-found: error
          retention-days: 14
      - name: Publicar descargas de prueba en nuestro repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=c10-controlplus-1.1-prueba
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "C10 ControlPlus 1.1 · prueba nativa" --notes-file docs/C10_REBUILD_11.md
          fi
          gh release upload "$TAG" deliverable/C10-ControlPlus-1.1.apk deliverable/C10-Instalador-1.0.apk deliverable/C10-ControlPlus-1.1-Codigo.zip deliverable/C10-ControlPlus-1.1-Paquete.zip deliverable/LEER-PRIMERO.md deliverable/SHA256.txt --clobber
