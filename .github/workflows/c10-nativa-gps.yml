name: C10 - diagnostico Android 11
on:
  push:
    branches: [c10-diagnostico-android11]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Obtener el mismo APK probado en el coche
        uses: actions/download-artifact@v4
        with:
          name: C10-Nativa-GPS-0.3
          path: /tmp/c10-original
          run-id: 44088504896
          github-token: ${{ github.token }}
      - name: Confirmar la identidad del APK
        run: |
          echo 'c98cb1a24f8fa67863e3f52f3dee40e8f38466c37c4bec73476e08840cfde5f5  /tmp/c10-original/app-release.apk' | sha256sum -c
      - name: Habilitar emulacion
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar instalacion en Android 11 AOSP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            echo "API: $(adb shell getprop ro.build.version.sdk)"
            echo "Servicios Google instalados:"
            adb shell pm list packages com.google.android.gms
            test -z "$(adb shell pm list packages com.google.android.gms | tr -d '\r')"
            adb install /tmp/c10-original/app-release.apk
            adb shell am start -W -n com.leapmotorguia.c10gps/com.leapmotorguia.c10nativa.MainActivity
            sleep 3
            adb shell pidof com.leapmotorguia.c10gps
            python3 c10-native/tests/emulator_smoke.py
