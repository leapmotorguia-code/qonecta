name: C10 Nativa Plus 0.8 compatibilidad
on:
  push:
    branches: [c10-nativa-compat-08]
    paths: ['app/**', '.github/workflows/c10-compat-08.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c10-compat-08-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK ARM64 para el coche
        run: |
          ./gradlew :app:assembleGithubRelease -Pc10Native=true -Pc10NativeAbis=arm64-v8a --stacktrace
          mkdir -p deliverable
          cp app/build/outputs/apk/github/release/*.apk deliverable/C10-Nativa-Plus-0.8-Compat-Coche.apk
      - name: Verificar configuración y firma del archivo para el coche
        run: |
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK=deliverable/C10-Nativa-Plus-0.8-Compat-Coche.apk
          "$TOOL_DIR/apksigner" verify --verbose "$APK" | tee deliverable/firma.txt
          "$TOOL_DIR/aapt" dump badging "$APK" > deliverable/configuracion.txt
          grep "name='com.leapmotorguia.c10nativeplus'" deliverable/configuracion.txt
          grep "sdkVersion:'29'" deliverable/configuracion.txt
          grep "targetSdkVersion:'29'" deliverable/configuracion.txt
          grep "versionCode='108'" deliverable/configuracion.txt
          if grep -q 'application-debuggable' deliverable/configuracion.txt; then exit 1; fi
          if grep -q 'testOnly' deliverable/configuracion.txt; then exit 1; fi
          python3 - <<'PY'
          import zipfile
          p='deliverable/C10-Nativa-Plus-0.8-Compat-Coche.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              abis={n.split('/')[1] for n in z.namelist() if n.startswith('lib/')}
              assert abis=={'arm64-v8a'},abis
          print('ARM64 only, correct native identity; no replacement of AutoKit.')
          PY
          sha256sum "$APK" > deliverable/SHA256.txt
      - name: Compilar variante equivalente para el emulador
        run: |
          ./gradlew :app:assembleGithubRelease -Pc10Native=true -Pc10NativeAbis=x86_64 --stacktrace
          cp app/build/outputs/apk/github/release/*.apk /tmp/native.apk
          python3 - <<'PY'
          import zipfile,hashlib
          def dex(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')}
          arm=dex('deliverable/C10-Nativa-Plus-0.8-Compat-Coche.apk')
          emulator=dex('/tmp/native.apk')
          assert arm and arm==emulator,(arm,emulator)
          print('PASS: ARM64 deliverable and x86 emulator build have identical application DEX bytecode.')
          PY
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 tools/c10_native_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Nativa-Plus-0.8-Compat-Coche
          path: deliverable/*
          if-no-files-found: error
          retention-days: 14
