name: C10 Control Pro - Original Android
on:
  push:
    branches: ['feature/c10-control-original-v1']
    paths:
      - 'original-c10-control/**'
      - '.github/workflows/c10-original-build.yml'
  workflow_dispatch:
concurrency:
  group: original-c10-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile entirely original application
        working-directory: original-c10-control
        run: ../gradlew --no-daemon --console=plain :app:assembleRelease --stacktrace
      - name: Check unmodified independent package and classes
        run: |
          grep -q "applicationId 'com.leapmotorguia.c10control'" original-c10-control/app/build.gradle
          if grep -R -E '(com\.headqlink|com\.andrerinas|com\.shilapi)' original-c10-control/app/src/main/java/; then
            echo 'Unexpected dependency on UNIT/HeadQLink classes'; exit 1
          fi
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: C10-Control-Pro-1.0-unsigned
          path: original-c10-control/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
