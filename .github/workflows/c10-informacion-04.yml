name: C10 Información 0.4
on:
  push:
    branches: [c10-nativa-informacion-04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Comprobar funciones existentes
        run: |
          mkdir -p /tmp/c10-test
          javac -d /tmp/c10-test c10-native/app/src/main/java/com/leapmotorguia/c10nativa/{CostCalculator,PerformanceTimer}.java c10-native/tests/{CostCalculatorCheck,PerformanceTimerCheck}.java
          java -cp /tmp/c10-test CostCalculatorCheck
          java -cp /tmp/c10-test PerformanceTimerCheck
      - name: Compilar
        run: ./gradlew -p c10-native :app:assembleRelease
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install c10-native/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.leapmotorguia.c10info04/com.leapmotorguia.c10nativa.MainActivity
            adb shell pidof com.leapmotorguia.c10info04
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Nativa-Informacion-0.4
          path: c10-native/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
