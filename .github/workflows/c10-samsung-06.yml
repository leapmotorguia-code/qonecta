name: C10 Prueba 0.6 Samsung
on:
  push:
    branches: [c10-samsung-06]
    paths: ['c10-native/**', '.github/workflows/c10-samsung-06.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Comprobar cálculos y temporizador
        run: |
          mkdir -p /tmp/c10-test
          javac -d /tmp/c10-test c10-native/app/src/main/java/com/leapmotorguia/c10nativa/{CostCalculator,PerformanceTimer}.java c10-native/tests/{CostCalculatorCheck,PerformanceTimerCheck}.java
          java -cp /tmp/c10-test CostCalculatorCheck
          java -cp /tmp/c10-test PerformanceTimerCheck
      - name: Compilar y verificar APK
        run: |
          ./gradlew -p c10-native :app:assembleRelease
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK=c10-native/app/build/outputs/apk/release/app-release.apk
          "$TOOL_DIR/apksigner" verify --verbose "$APK"
          "$TOOL_DIR/aapt" dump badging "$APK" | tee /tmp/c10-badging
          grep "name='com.leapmotorguia.c10prueba06'" /tmp/c10-badging
          grep "sdkVersion:'23'" /tmp/c10-badging
          grep "targetSdkVersion:'36'" /tmp/c10-badging
          grep "versionCode='6'" /tmp/c10-badging
          mkdir -p deliverable
          cp "$APK" deliverable/C10-Prueba-0.6-Samsung.apk
          sha256sum deliverable/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Prueba-0.6-Samsung
          path: deliverable/*.apk
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            image: default
          - api: 35
            image: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: C10-Prueba-0.6-Samsung
          path: /tmp/c10-apk
      - run: |
          mkdir -p c10-native/app/build/outputs/apk/release
          cp /tmp/c10-apk/*.apk c10-native/app/build/outputs/apk/release/app-release.apk
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.image }}
          disable-animations: true
          script: python3 c10-native/tests/samsung06_smoke.py
