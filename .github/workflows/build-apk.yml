name: Build APK
on:
  push:
    branches: ['feat/cockpit-base', 'ci/cockpit-artifact-check']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Dependency inventory
        run: |
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > runtime-dependencies.txt
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: drivecore-cockpit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: drivecore-runtime-dependencies
          path: runtime-dependencies.txt
          if-no-files-found: error
