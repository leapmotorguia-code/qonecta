name: Experimental single APK - Open Headunit source
on:
  push:
    branches: ['feat/cockpit-headunit-integration']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Install required SDKs and NDKs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-36' 'platforms;android-34' 'build-tools;35.0.0' 'platform-tools' 'ndk;28.1.13356709' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Compile libusb and FFmpeg audio from source
        run: |
          bash native/build-libusb.sh
          bash native/build-ffmpeg.sh
      - name: Compose real receiver and instrument panel from source
        run: |
          bash native/build-headunit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drivecore-headunit-integrated-EXPERIMENTAL
          path: combined-output/
          if-no-files-found: error
