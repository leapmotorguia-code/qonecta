name: C10 Control Pro 6.0 - APK
on:
  push:
    branches: ['feature/c10-control-pro-v6-propio']
    paths: ['c10-control-pro-2.0/**', '.github/workflows/c10-control-pro-v6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Tests and build
        working-directory: c10-control-pro-2.0
        run: |
          bash tests/run.sh
          gradle --no-daemon --console=plain assembleCoche
      - name: Verify signed APK
        run: |
          cp c10-control-pro-2.0/app/build/outputs/apk/coche/app-coche.apk C10-Control-Pro-6.0-PRUEBA.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs C10-Control-Pro-6.0-PRUEBA.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging C10-Control-Pro-6.0-PRUEBA.apk
          sha256sum C10-Control-Pro-6.0-PRUEBA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Control-Pro-6.0-PRUEBA
          path: C10-Control-Pro-6.0-PRUEBA.apk
          if-no-files-found: error
          retention-days: 14
      - name: Lint
        working-directory: c10-control-pro-2.0
        continue-on-error: true
        run: gradle --no-daemon --console=plain lintCoche
