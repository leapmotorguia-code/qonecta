name: C10 Control Pro 6.3 - APK
on:
  push:
    branches: ['feature/c10-control-pro-v6-propio']
    paths: ['c10-control-pro-2.0/**', '.github/workflows/c10-control-pro-v6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Tests and build
        working-directory: c10-control-pro-2.0
        run: |
          bash tests/run.sh
          gradle --no-daemon --console=plain assembleCoche
      - name: Verify signed APK
        run: |
          cp c10-control-pro-2.0/app/build/outputs/apk/coche/app-coche.apk C10-Control-Pro-6.3-MULTIMEDIA.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs C10-Control-Pro-6.3-MULTIMEDIA.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging C10-Control-Pro-6.3-MULTIMEDIA.apk
          sha256sum C10-Control-Pro-6.3-MULTIMEDIA.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Control-Pro-6.3-MULTIMEDIA
          path: |
            C10-Control-Pro-6.3-MULTIMEDIA.apk
            apksigner.jar
            zipalign
          if-no-files-found: error
          retention-days: 14
      - name: Lint
        working-directory: c10-control-pro-2.0
        run: gradle --no-daemon --console=plain lintCoche
