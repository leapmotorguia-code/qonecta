name: C10 Nativa - prueba de pantalla
on:
  push:
    branches: [c10-nativa-prueba]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Probar cálculos
        run: |
          mkdir -p /tmp/c10-test
          javac -d /tmp/c10-test c10-native/app/src/main/java/com/leapmotorguia/c10nativa/CostCalculator.java c10-native/tests/CostCalculatorCheck.java
          java -cp /tmp/c10-test CostCalculatorCheck
      - name: Compilar APK independiente
        run: ./gradlew -p c10-native :app:assembleDebug --stacktrace
      - name: Habilitar emulación acelerada
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la aplicación en un dispositivo Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r c10-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.leapmotorguia.c10nativa/.MainActivity
            sleep 3
            adb shell pidof com.leapmotorguia.c10nativa
            adb shell dumpsys activity activities | grep -F 'com.leapmotorguia.c10nativa/.MainActivity'
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Nativa-Prueba-0.1
          path: c10-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
