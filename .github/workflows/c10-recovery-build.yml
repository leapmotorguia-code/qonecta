name: C10 recovery build
on:
  push:
    branches: [feature/c10-plus-60-recovery]
  pull_request:
    branches: [feature/unit-45-cockpit-merge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Isolate test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          assert 'applicationId = "com.headqlink.app"' in s
          p.write_text(s.replace('applicationId = "com.headqlink.app"','applicationId = "es.leapmotorguia.c10recovery"'))
          PY
      - run: bash gradlew --no-daemon :app:assembleGithubDebug
      - uses: actions/upload-artifact@v4
        with:
          name: c10-recovery-baseline-not-6.0
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
