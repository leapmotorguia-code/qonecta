name: C10 Plus - APK prueba

on:
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/java/com/headqlink/link/C10PlusScreen.java"
      - "app/src/main/java/com/headqlink/link/CarHubScreen.java"
      - "app/src/main/java/com/headqlink/link/CarUi.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/build.gradle.kts"
      - ".github/workflows/c10plus-prueba-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install project NDK and CMake
        run: |
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build C10 Plus beta (separate package, debug signing)
        run: ./gradlew :app:assembleGithubDebug -Pc10plusTest --stacktrace
      - name: Upload APK even when tests unavailable
        uses: actions/upload-artifact@v4
        with:
          name: C10-Plus-APK-Prueba
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
