name: C10 Complemento 1.3 comprobacion
on:
  push:
    branches: [c10-unit-companion-13]
    paths: ['android-companion/**', '.github/workflows/c10-unit-companion.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: c10-unit-companion
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar y probar
        run: |
          mkdir -p deliverable
          gradle -p android-companion :app:assembleRelease :app:testReleaseUnitTest --stacktrace > deliverable/compilacion.txt 2>&1 || { tail -120 deliverable/compilacion.txt; exit 1; }
          cp android-companion/app/build/outputs/apk/release/*.apk deliverable/C10-Complemento-1.3.apk
          cp android-companion/app/build/test-results/testReleaseUnitTest/TEST-*.xml deliverable/
      - name: Verificar firma SDK y alineacion
        run: |
          TOOL_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOL_DIR/apksigner" verify --verbose --print-certs deliverable/C10-Complemento-1.3.apk > deliverable/firma.txt
          "$TOOL_DIR/zipalign" -c -P 16 4 deliverable/C10-Complemento-1.3.apk
          "$TOOL_DIR/aapt" dump badging deliverable/C10-Complemento-1.3.apk > deliverable/configuracion.txt
          grep "sdkVersion:'28'" deliverable/configuracion.txt
          grep "targetSdkVersion:'35'" deliverable/configuracion.txt
          ! grep -q 'application-debuggable\|testOnly' deliverable/configuracion.txt
      - name: Preparar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-c10-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 android-companion/smoke.py
      - name: Preparar entrega
        run: |
          cp android-companion/LEER-PRIMERO.md deliverable/
          git archive --format=zip --output=deliverable/C10-Complemento-1.3-Codigo.zip HEAD android-companion .github/workflows/c10-unit-companion.yml
          git rev-parse HEAD > deliverable/COMMIT.txt
          sha256sum deliverable/*.apk deliverable/*Codigo.zip > deliverable/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C10-Complemento-1.3-Resultado
          path: deliverable/*
          retention-days: 14
      - name: Publicar prueba propia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=c10-complemento-1.3-prueba
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "C10 Complemento 1.3 · prueba independiente" --notes-file android-companion/LEER-PRIMERO.md
          fi
          gh release upload "$TAG" deliverable/C10-Complemento-1.3.apk deliverable/C10-Complemento-1.3-Codigo.zip deliverable/LEER-PRIMERO.md deliverable/SHA256.txt --clobber
