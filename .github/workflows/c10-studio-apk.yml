name: C10 Studio independiente - compilación APK de prueba
on:
  push:
    branches: ["feature/c10-studio-independiente-v1"]
    paths:
      - "c10-studio-app/**"
      - ".github/workflows/c10-studio-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Preparar compilador Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verificar interfaz sin dependencias de red
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          s=open("c10-studio-app/assets/index.html",encoding="utf-8").read()
          m=re.search(r"<script>([\s\S]*?)</script>",s)
          assert m, "No hay JS local"
          open("/tmp/c10studio.js","w").write(m.group(1))
          assert "C10Native" in s
          PY
          node --check /tmp/c10studio.js
      - name: Generar APK Android independiente sin firma
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          SRC="c10-studio-app"
          mkdir -p "$SRC/out/obj" "$SRC/out/dex" "$SRC/out/dist"
          javac -source 8 -target 8 -Xlint:none -encoding UTF-8 \
            -classpath "$PLATFORM" -d "$SRC/out/obj" \
            "$SRC/src/es/leapmotorguia/c10studio/MainActivity.java"
          find "$SRC/out/obj" -name '*.class' -print0 | \
            xargs -0 "$BT/d8" --min-api 26 --lib "$PLATFORM" --output "$SRC/out/dex"
          "$BT/aapt2" link --manifest "$SRC/AndroidManifest.xml" \
            -I "$PLATFORM" --min-sdk-version 26 --target-sdk-version 32 \
            --version-code 100 --version-name "1.0.0" \
            -o "$SRC/out/dist/unsigned.apk"
          ( cd "$SRC/out/dex" && zip -q -9 -u ../dist/unsigned.apk classes.dex )
          ( cd "$SRC" && zip -q -9 -r out/dist/unsigned.apk assets )
          "$BT/zipalign" -f -p 4 "$SRC/out/dist/unsigned.apk" \
            "$SRC/out/dist/C10-Studio-1.0.0-unsigned-aligned.apk"
          "$BT/zipalign" -c -v 4 "$SRC/out/dist/C10-Studio-1.0.0-unsigned-aligned.apk"
          unzip -t "$SRC/out/dist/C10-Studio-1.0.0-unsigned-aligned.apk" | tail -1
          mkdir -p "$SRC/out/dist/tools"
          cp "$BT/lib/apksigner.jar" "$SRC/out/dist/tools/"
          cp "$BT/zipalign" "$SRC/out/dist/tools/"
      - uses: actions/upload-artifact@v4
        with:
          name: C10-Studio-v1-sin-firmar-y-herramientas
          path: |
            c10-studio-app/out/dist/C10-Studio-1.0.0-unsigned-aligned.apk
            c10-studio-app/out/dist/tools/apksigner.jar
            c10-studio-app/out/dist/tools/zipalign
          if-no-files-found: error
          retention-days: 14
