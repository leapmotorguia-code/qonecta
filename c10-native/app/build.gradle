plugins { id 'com.android.application' }

android {
    namespace 'com.leapmotorguia.c10nativa'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tencent.qqmusiccar'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.5c-instalacion'
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // A local test signature, not a production or vehicle-vendor certificate.
            signingConfig signingConfigs.debug
        }
    }
    // This side-loaded compatibility experiment is not submitted to Google Play.
    lint { disable 'ExpiredTargetSdkVersion' }
}
