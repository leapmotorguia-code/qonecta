plugins { id 'com.android.application' }

android {
    namespace 'com.leapmotorguia.c10nativa'
    compileSdk 36
    defaultConfig {
        applicationId 'com.leapmotorguia.c10nativa'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.2-prueba'
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // A local test signature, not a production or vehicle-vendor certificate.
            signingConfig signingConfigs.debug
        }
    }
}
