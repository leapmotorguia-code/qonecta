plugins { id 'com.android.application' }

android {
    namespace 'com.leapmotorguia.c10nativa'
    compileSdk 36
    defaultConfig {
        applicationId 'com.leapmotorguia.c10prueba06'
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName '0.6-samsung'
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // A local test signature, not a production or vehicle-vendor certificate.
            signingConfig signingConfigs.debug
        }
    }
}
