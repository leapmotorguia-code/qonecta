plugins { id 'com.android.application' }

android {
    namespace 'com.leapmotorguia.c10nativa'
    compileSdk 36
    defaultConfig {
        applicationId 'com.leapmotorguia.c10info04b'
        minSdk 23
        targetSdk 30
        versionCode 4
        versionName '0.4b-android11'
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            // A local test signature, not a production or vehicle-vendor certificate.
            signingConfig signingConfigs.debug
        }
    }
    // This side-loaded compatibility experiment is not submitted to Google Play.
    lint { disable 'ExpiredTargetSdkVersion' }
}
